name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'mix.exs'
      - 'lib/**/*.ex'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'mix.exs'
      - 'lib/**/*.ex'
      - '.github/workflows/docs.yml'

env:
  MIX_ENV: dev
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"
  # Every package in the repo, so a new one cannot be missed in the loops below.
  PACKAGES: 'gen_server_virtual_time actor_simulation actor_simulation_codegen gen_server_virtual_time_migrate'

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-docs-v2-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-docs-v2-
      
      - name: Install dependencies
        run: |
          for package in $PACKAGES; do
            (cd "packages/$package" && mix deps.get)
          done

      - name: Build documentation
        run: |
          for package in $PACKAGES; do
            (cd "packages/$package" && mix docs)
          done
          mkdir -p site
          cp -R packages/gen_server_virtual_time/doc/. site/
          for package in $PACKAGES; do
            if [ "$package" != "gen_server_virtual_time" ]; then
              mkdir -p "site/$package"
              cp -R "packages/$package/doc/." "site/$package/"
            fi
          done

      - name: Check for documentation warnings
        run: |
          failed=0
          for package in $PACKAGES; do
            if echo "$output" | grep -q "warning:.*does not exist"; then
              echo "❌ $package documentation has broken links"
              failed=1
            fi
          done
          exit $failed
      
      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: site/
          retention-days: 7
      
      - name: Upload EPUB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-epub
          path: packages/gen_server_virtual_time/doc/GenServerVirtualTime.epub
          retention-days: 7
  
  generate-diagrams:
    name: Generate Sequence Diagrams
    runs-on: ubuntu-latest
    # The workflow runs in dev, but this job runs tests, which need the test-only
    # dependencies (stream_data, excoveralls).
    env:
      MIX_ENV: test
    if: |
      contains(github.event.head_commit.message, '[diagrams]') ||
      github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-diagrams-v2-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-diagrams-v2-
      
      - name: Install dependencies
        run: |
          for package in gen_server_virtual_time actor_simulation; do
            (cd "packages/$package" && mix deps.get)
          done
      
      - name: Generate sequence diagrams
        working-directory: packages/actor_simulation
        run: mix test --only diagram_generation
      
      - name: Upload diagrams
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sequence-diagrams
          path: generated/examples/*.html
          retention-days: 7
  
  validate-markdown:
    name: Validate Markdown Links
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/workflows/markdown-link-check-config.json'
          check-modified-files-only: 'yes'
        continue-on-error: true

