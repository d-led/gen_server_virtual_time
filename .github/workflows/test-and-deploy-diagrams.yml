name: Test and Deploy Diagrams

on:
  push:
    branches:
      - main
    paths:
      - 'lib/actor_simulation/mermaid_report_generator.ex'
      - 'test/diagram_generation_test.exs'
      - 'test/termination_indicator_test.exs'
      - 'test/mermaid_report_test.exs'
      - 'test/dining_philosophers_test.exs'
      - 'generated/examples/**/*.html'
      - 'generated/examples/**/*.md'
      - '.github/workflows/test-and-deploy-diagrams.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/actor_simulation/mermaid_report_generator.ex'
      - 'test/diagram_generation_test.exs'
      - 'test/termination_indicator_test.exs'
      - 'test/mermaid_report_test.exs'
      - 'test/dining_philosophers_test.exs'
      - 'generated/examples/**/*.html'
      - 'generated/examples/**/*.md'
      - '.github/workflows/test-and-deploy-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests and Generate Diagrams
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
            packages/*/deps
            packages/*/_build
          key: ${{ runner.os }}-mix-diagrams-v2-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-diagrams-v2-

      - name: Install dependencies
        run: |
          for package in gen_server_virtual_time actor_simulation; do
            (cd "packages/$package" && mix deps.get)
          done

      - name: Run diagram generation tests
        env:
          MIX_ENV: test
        working-directory: packages/actor_simulation
        run: mix test --only diagram_generation
      
      - name: Run flowchart report tests  
        env:
          MIX_ENV: test
        working-directory: packages/actor_simulation
        run: mix test test/mermaid_report_test.exs

      - name: Copy sequence diagrams to reports directory
        run: |
          cp generated/examples/mermaid_*.html generated/examples/reports/ || true
          cp generated/examples/dining_*.html generated/examples/reports/ || true
          echo "✅ Copied sequence diagrams to reports directory"

      - name: Upload all examples artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-site
          path: generated/examples
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    
    # Only deploy on push to main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download examples site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: examples-site
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

