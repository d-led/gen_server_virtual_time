name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'dev/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'VERSION'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - 'examples/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'dev/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'VERSION'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
      - 'examples/**'

jobs:
  test:
    name: Test ${{ matrix.package }} (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    strategy:
      matrix:
        # Deliberately small: the versions we actually support.
        # Explicit pairs, because OTP support is per Elixir minor. The clock gets
        # the whole matrix; the packages that build on it get the newest pair.
        include:
          - package: gen_server_virtual_time
            elixir: '1.19'
            otp: '28'
          - package: gen_server_virtual_time
            elixir: '1.20'
            otp: '29'
          - package: actor_simulation
            elixir: '1.20'
            otp: '29'
          - package: actor_simulation_codegen
            elixir: '1.20'
            otp: '29'
    
    env:
      MIX_ENV: test
      CI: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Compile
        run: mix compile --warnings-as-errors
      
      - name: Run tests (exclude slow)
        run: |
          mix test --exclude slow --exclude omnetpp \
            --formatter JUnitFormatter \
            --formatter ExUnit.CLIFormatter \
            --slowest 10
      
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.package }}-${{ matrix.elixir }}-${{ matrix.otp }}
          path: packages/${{ matrix.package }}/_build/test/lib/${{ matrix.package }}/test-junit-report.xml
      
      - name: Publish test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: 'packages/${{ matrix.package }}/_build/test/lib/${{ matrix.package }}/test-junit-report.xml'
          check_name: 'Test Report (${{ matrix.package }}, Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})'
          detailed_summary: true
          include_passed: true
  
  coverage:
    name: Coverage & All Tests
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-coverage-${{ hashFiles('**/mix.lock') }}
      
      - name: Install dependencies
        run: mix deps.get
        working-directory: packages/gen_server_virtual_time
      
      - name: Run fast tests with coverage export
        env:
          MIX_ENV: test
        working-directory: packages/gen_server_virtual_time
        run: mix coveralls --export-coverage fast
      
      - name: Run slow tests with coverage export (for coverage completeness)
        env:
          MIX_ENV: test
        working-directory: packages/gen_server_virtual_time
        continue-on-error: true
        run: mix coveralls --only slow --export-coverage slow
      
      - name: Run diagram generation tests with coverage export
        env:
          MIX_ENV: test
        working-directory: packages/gen_server_virtual_time
        continue-on-error: true
        run: mix coveralls --only diagram_generation --export-coverage diagram
      
      - name: Merge coverage and report to GitHub
        env:
          MIX_ENV: test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/gen_server_virtual_time
        run: |
          mix test.coverage
          mix coveralls.github --import-cover cover

  package-tests:
    name: Test remaining packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'

      - name: Install dependencies
        run: |
          for package in gen_server_virtual_time actor_simulation actor_simulation_codegen; do
            (cd "packages/$package" && mix deps.get)
          done
          mix deps.get

      - name: Run every package suite and the workspace tooling tests
        env:
          MIX_ENV: test
        run: ./scripts/test.sh
  
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
      
      - name: Install dependencies
        run: |
          mix deps.get
          for package in gen_server_virtual_time actor_simulation actor_simulation_codegen; do
            (cd "packages/$package" && mix deps.get)
          done

      - name: Check formatting (the workspace and every package)
        run: |
          mix format --check-formatted
          for package in gen_server_virtual_time actor_simulation actor_simulation_codegen; do
            (cd "packages/$package" && mix format --check-formatted)
          done

      - name: Run Credo
        run: |
          for package in gen_server_virtual_time actor_simulation actor_simulation_codegen; do
            (cd "packages/$package" && mix credo --strict)
          done
        continue-on-error: true

      - name: Run Dialyzer
        run: |
          for package in gen_server_virtual_time actor_simulation actor_simulation_codegen; do
            (cd "packages/$package" && mix dialyzer --format github)
          done
  
  generated-vlingo:
    name: Test Generated VLINGO XOOM Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Install Elixir dependencies
        run: mix deps.get
      
      - name: Generate VLINGO sample project
        run: mix run scripts/generate_vlingo_sample.exs
      
      - name: Build VLINGO generated code
        working-directory: generated/vlingo_loadbalanced
        run: mvn clean compile
      
      - name: Run VLINGO tests
        working-directory: generated/vlingo_loadbalanced
        run: mvn test
      
      - name: Upload VLINGO test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vlingo-test-results
          path: generated/vlingo_loadbalanced/target/surefire-reports/*.xml
  
  validate-generators:
    name: Validate All Generator Scripts
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20'
          otp-version: '29'
      
      - name: Install dependencies
        run: mix deps.get
      
      - name: Run OMNeT++ generator script
        run: |
          mix run scripts/generate_omnetpp_examples.exs
          # Check that at least one file was generated
          if [ ! -f "examples/omnetpp_pubsub/PubSubNetwork.ned" ]; then
            echo "ERROR: OMNeT++ generator did not create expected files"
            exit 1
          fi
          echo "✓ OMNeT++ generator: OK"
      
      - name: Run CAF generator script
        run: |
          mix run scripts/generate_caf_examples.exs
          # Check that at least one file was generated
          if [ ! -f "examples/caf_pubsub/main.cpp" ]; then
            echo "ERROR: CAF generator did not create expected files"
            exit 1
          fi
          echo "✓ CAF generator: OK"
      
      - name: Run Pony generator script
        run: |
          mix run scripts/generate_pony_examples.exs
          # Check that at least one file was generated
          if [ ! -f "generated/pony_loadbalanced/main.pony" ]; then
            echo "ERROR: Pony generator did not create expected files"
            exit 1
          fi
          echo "✓ Pony generator: OK"
      
      - name: Run Phony generator script
        run: |
          mix run scripts/generate_phony_examples.exs
          # Check that at least one file was generated
          if [ ! -f "generated/phony_burst/main.go" ]; then
            echo "ERROR: Phony generator did not create expected files"
            exit 1
          fi
          echo "✓ Phony generator: OK"
      
      - name: Run VLINGO generator script
        run: |
          mix run scripts/generate_vlingo_sample.exs
          # Check that at least one file was generated
          if [ ! -f "generated/vlingo_loadbalanced/pom.xml" ]; then
            echo "ERROR: VLINGO generator did not create expected files"
            exit 1
          fi
          echo "✓ VLINGO generator: OK"
      
      - name: Run Ractor generator script
        run: |
          mix run examples/ractor_demo.exs
          # Check that at least one file was generated
          if [ ! -f "examples/ractor_burst/Cargo.toml" ]; then
            echo "ERROR: Ractor generator did not create expected files"
            exit 1
          fi
          echo "✓ Ractor generator: OK"
      
      - name: Summary
        run: |
          echo "================================================"
          echo "✅ All 6 generator scripts executed successfully"
          echo "================================================"
          echo "Generators validated:"
          echo "  ✓ OMNeT++ (C++ network simulation)"
          echo "  ✓ CAF (C++ actors)"
          echo "  ✓ Pony (capabilities-secure actors)"
          echo "  ✓ Phony (Go actors)"
          echo "  ✓ Ractor (Rust actors)"
          echo "  ✓ VLINGO XOOM (Java actors)"
          echo "================================================"