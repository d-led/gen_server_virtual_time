name: Publish to Hex.pm

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-alpha.*'

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-publish-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-publish-

      - name: Install dependencies
        run: |
          mix deps.get --only prod
          MIX_ENV=dev mix deps.get --only dev
          # The test step below runs in the test env, which needs its own deps:
          # stream_data and junit_formatter are only fetched for :test.
          MIX_ENV=test mix deps.get --only test

      - name: Compile project
        run: |
          mix compile
          MIX_ENV=dev mix compile

      - name: Run tests
        env:
          # The workflow-level MIX_ENV is prod, under which test/support is not
          # compiled, so any test that imports a support module fails to compile.
          MIX_ENV: test
        run: mix test --exclude slow --exclude omnetpp

      - name: Build documentation
        env:
          MIX_ENV: dev
        run: mix docs

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: dev
        run: |
          mix hex.publish --yes --replace

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-beta.') || contains(github.ref, '-alpha.') }}
          files: |
            CHANGELOG.md

