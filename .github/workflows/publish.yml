name: Publish to Hex.pm

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-alpha.*'

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-publish-${{ hashFiles('**/mix.lock', 'VERSION') }}

      - name: Check that every package is at the tagged version
        run: elixir scripts/release.exs check

      - name: Test, document and publish each package in dependency order
        env:
          # The workflow-level MIX_ENV is prod, under which test/support is not
          # compiled, so the test step below sets it explicitly.
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: dev
          # With this set the package's mix.exs resolves a sibling as a plain
          # version requirement instead of a local path, which is what Hex
          # accepts.
          HEX_PUBLISH: "1"
        run: |
          set -e
          version=$(tr -d '[:space:]' < VERSION)
          # The migrator is deliberately absent: it is a one-off text rewrite that
          # runs from a checkout, and its published versions are retired on Hex.
          # Publishing four packages from every tag is churn the ecosystem does not
          # need, and the tool gains nothing from being a dependency.
          for package in gen_server_virtual_time actor_simulation actor_simulation_codegen; do
            echo ""
            echo "=== $package ==="
            cd "packages/$package"
            # Publishing is resumable: a package that already carries this
            # version is left alone, so a failed run can simply be re-run.
            if mix hex.info "$package" "$version" > /dev/null 2>&1; then
              echo "$package $version is already published — skipping"
              cd -
              continue
            fi
            # The packages are published in dependency order, so a dependency may
            # take a moment to become resolvable after it was published.
            for attempt in 1 2 3 4 5; do
              if mix deps.get; then break; fi
              echo "waiting for the packages this one depends on..."
              sleep 10
            done
            mix deps.get
            mix compile --warnings-as-errors
            MIX_ENV=test mix deps.get --only test
            (MIX_ENV=test mix test --exclude slow --exclude omnetpp)
            MIX_ENV=dev mix docs
            mix hex.publish --yes
            cd -
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-beta.') || contains(github.ref, '-alpha.') }}
          files: |
            CHANGELOG.md

